  <body>
    <div class="app-page">
      <div class="app-topbar">
        <div class="app-title">
          <h1>Citizens Reporting Solution App</h1>
        </div>
        <nav>
          <p>Please report an incidence around you</p>
          <a href="login.html" id="authenticate" class="app-button"
            >Add Incidence</a
          >
        </nav>
      </div>

      <main>
        <div class="filter">
          <label for="categoryFilter">Filter: </label>
          <select id="categoryFilter">
            <option value="">All Categories</option>
          </select>
          <button id="filterButton" class="app-button">Apply Filter</button>
        </div>
        <div class="card-wrapper" id="cardWrapper"></div>
      </main>
      <footer>
        <p>Citizens Reporting Solution App</p>
        <span>Be your brother's keeper</span>
      </footer>
    </div>

        .catch((err) => {
          console.error("An error occurred while retrieving token. ", err);

    <script type="module" src="js/index.js"></script>
