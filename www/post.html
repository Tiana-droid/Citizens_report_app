<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="css/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRSA - Post</title>
  </head>
  <body>
    <div class="app-page">
      <div class="app-topbar">
        <div class="app-title">
          <h1>Add an Incident</h1>
        </div>
      </div>
      <div id="status"></div>
      <form id="createForm">
        <label for="incidentType">What type of Incidence is this?:</label><br />
        <input
          type="text"
          id="incidentType"
          name="incidentType"
          required
        /><br /><br />

        <label for="date">Date:</label><br/>
        <input type="date" name="date" id="date"> <br/> <br/>

        <label for="title">Title:</label><br />
        <input type="text" id="title" name="title" required /><br /><br />

        <label for="content">Content:</label><br />
        <textarea id="content" name="content" required></textarea><br /><br />
        <label for="">Upload image (<i>image must not be more than 60kb</i>)</label>
        <input type="file" id="imageInput" accept="image/*" required><br /><br />
        <label>Location</label> <br/>
        <input type="text" name="location" id="location"><br /><br />

        <button  type="submit">Update</button>
      </form>
    </div>

    <script type="module" src="js/index.js"></script>
    <script src="js/post.js"></script>
  </body>
</html>
