<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * self blob: data: gap:; style-src * self 'unsafe-inline' blob: data: gap:; script-src * 'self' 'unsafe-eval' 'unsafe-inline' blob: data: gap:; object-src * 'self' blob: data: gap:; img-src * self 'unsafe-inline' blob: data: gap:; connect-src self * 'unsafe-inline' blob: data: gap:; frame-src * self blob: data: gap:;"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="css/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRSA - Post An Incidence</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />  
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Leaflet CSS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  </head>
  <body>
    <div class="app-page">
      <div class="app-topbar">
        <div class="app-title">
          <h1>Add an Incident</h1>
        </div>
      </div>
      <div id="status"></div>
      <form id="createForm">
        <label for="incidentType">What type of Incidence is this?:</label><br />
        <select name="incidentType" id="incidentType" required>
          <option value="Accident">Accident</option>
          <option value="Fire">Fire</option>
          <option value="Flood">Flood</option>
          <option value="Robbery">Robbery</option>
          <option value="Theft">Theft</option>
          <option value="Assault">Assault</option>
          <option value="Vandalism">Vandalism</option>
          <option value="Domestic Violence">Domestic Violence</option>
          <option value="Missing Person">Missing Person</option>
          <option value="Drug-related">Drug-related</option>
          <option value="Traffic Violation">Traffic Violation</option>
          <option value="Rioting">Rioting</option>
          <option value="Cybercrime">Cybercrime</option>
          <option value="Other">Other</option>
        </select>
        <br /><br />

        <label for="datePickerId">Date:</label><br />
        <input type="date" name="date" id="datePickerId" required/> <br />
        <br />

        <label for="title">Title:</label><br />
        <input type="text" id="title" name="title" required /><br /><br />

        <label for="content">Content:</label><br />
        <textarea id="content" name="content" required></textarea><br /><br />
        <label for=""
          >Upload image (<i>image must not be more than 60kb</i>)</label
        >
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          required
        /><br /><br />
        <label>Location</label> <br />
        <input type="text" id="addressInput" placeholder="Enter location address" required />
        <button type="button" id="locateBtn">Locate on Map</button>
        <div id="map" style="height: 300px"></div>
        <input type="hidden" id="latitude" />
        <input type="hidden" id="longitude" /> 
        <br> <br>

        <button type="submit">Submit</button>
      </form>
    </div>
    <!-- <script src="https://cdn.jsdelivr.net/npm/uuid@9.0.1/dist/umd/uuidv4.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/uuid@9.0.1/dist/umd/uuid.min.js"></script>
   
    <script type="module" src="js/index.js"></script>
    <script src="js/post.js"></script>
    <!-- <script src="js/main.js"></script> -->
    <!-- Leaflet JS -->
  </body>
</html>
